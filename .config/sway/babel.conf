output * bg $wallpaper fill

set $display1 DP-1
set $display2 DP-2

output $display1 {
    mode 2560x1440@279.961Hz
    position 0 0
}
output $display2 {
    mode 1920x1080@60.000Hz
    position 2560 0
    # disable
}

# Always-present screen for wayvnc; unreachable by mouse
exec swaymsg create_output
output HEADLESS-1 {
    mode 1920x1080
    position 10000 10000
}
workspace vnc output HEADLESS-1

workspace 1 output $display1
exec swaymsg focus output $display1

# 60 seconds (60 * 1000)
seat "*" hide_cursor 60000

# Remote mode: physical monitors off, no idle lock or sleep. Works over VNC too.
bindsym Mod4+Shift+u exec ~/.config/sway/scripts/toggle-remote-mode.sh

exec swayidle -w \
  timeout 480 'systemctl --user -q is-active remote-mode || swaylock -f' \
  timeout 600 'systemctl --user -q is-active remote-mode || systemctl suspend' \
  before-sleep 'swaylock -f'
